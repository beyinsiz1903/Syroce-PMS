name: Deploy to Droplet

on:
  workflow_run:
    workflows: ["Syroce PMS CI/CD Pipeline", "Frontend Quality Gates"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Verify both required workflows for the exact main revision
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.DEPLOY_SHA;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const main = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
            if (main.data.commit.sha !== sha) {
              core.notice('Superseded revision: not deploying.');
              core.setOutput('ready', 'false');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...repo, head_sha: sha, branch: 'main', event: 'push', per_page: 100
            });
            const required = ['Syroce PMS CI/CD Pipeline', 'Frontend Quality Gates'];
            const ready = required.every(name => {
              const latest = runs.filter(r => r.name === name).sort((a,b) => b.id-a.id)[0];
              return latest?.conclusion === 'success';
            });
            core.setOutput('ready', String(ready));
            if (!ready) core.notice('Both required push workflows must pass; no deployment performed.');

      - name: Deploy to Server
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 30m
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            exec 9>/var/lock/syroce-pms-deploy.lock
            flock -n 9 || { echo "Another deployment is already running"; exit 1; }

            cd /opt/syroce-pms
            # Deploy the exact revision that passed the full CI workflow.  A
            # plain `git pull origin main` can otherwise release a newer commit
            # whose checks are still running.
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$DEPLOY_SHA" || { echo "Revision superseded; skipping"; exit 0; }
            git reset --hard HEAD
            git fetch --depth=1 origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"

            # Keep the host monitor versioned with the deployment and derive
            # expected containers from Compose service identities. This avoids
            # stale hard-coded backend-2/worker-2 alarms after capacity changes.
            install -m 0755 deploy/syroce-healthwatch.sh /usr/local/sbin/syroce-healthwatch

            # Fail before disrupting the running stack when the production
            # Exely webhook trust boundary is invalid.  The compose service
            # supplies backend/.env without echoing its secrets; the verifier
            # logs only redacted configuration summaries.  This prevents a
            # forgotten dev bypass from silently reaching a later deployment.
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              python scripts/verify_exely_whitelist.py --env production
            
            # Build sequentially while the current containers continue serving.
            # Never tear the whole stack down before a build: worker image
            # installation can take several minutes on this Droplet.
            docker compose -f docker-compose.prod.yml build backend
            docker compose -f docker-compose.prod.yml build worker
            docker compose -f docker-compose.prod.yml build beat
            docker compose -f docker-compose.prod.yml build frontend

            # Replace only services whose image/config changed, then wait for
            # every Compose healthcheck. Nginx remains online throughout the
            # image build instead of exposing a multi-minute hard outage.
            if ! docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180; then
              echo "::error::Production service startup or health verification failed"
              docker compose -f docker-compose.prod.yml ps --all || true
              echo "--- service startup diagnostics (last 150 lines per service; no environment dump) ---"
              docker compose -f docker-compose.prod.yml logs --no-color --tail=150 frontend backend worker beat nginx || true
              exit 1
            fi

            # Nginx receives its production configuration through a bind mount.
            # Compose does not recreate a running container merely because that
            # host file changed, so validate and reload it explicitly. This is a
            # zero-downtime reload and makes proxy/cache policy changes effective
            # in the deployment that introduced them.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

            # Verify both local service topology and the public route before
            # considering the deployment successful.
            /usr/local/sbin/syroce-healthwatch
