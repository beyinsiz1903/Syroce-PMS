name: Nilvera Sandbox E2E

on:
  workflow_dispatch:
    inputs:
      run_incoming_fixture:
        description: Run only the explicitly approved incoming fixture preparation test
        required: true
        default: false
        type: boolean
      run_incoming_answer:
        description: Run the explicitly approved incoming invoice answer write test
        required: true
        default: false
        type: boolean
      run_reconciliation:
        description: Run only the read-only incoming fixture reconciliation test
        required: true
        default: false
        type: boolean
      reconciliation_source_run_id:
        description: GitHub Actions run ID that produced the fixture identity
        required: false
        default: ''
        type: string
      reconciliation_source_timestamp:
        description: UTC timestamp of the GitHub Actions run that produced the fixture identity
        required: false
        default: ''
        type: string

env:
  PYTHON_VERSION: '3.11'
  MONGO_URL: mongodb://localhost:27017/hotel_pms_test
  DB_NAME: hotel_pms_test
  JWT_SECRET: ci-test-secret-key-do-not-use-in-production

jobs:
  nilvera-e2e:
    name: Run Nilvera Sandbox E2E Tests
    runs-on: ubuntu-latest
    environment: nilvera-sandbox
    concurrency:
      group: nilvera-sandbox
      cancel-in-progress: false
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements/all.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          bash scripts/post_install.sh
          pip install pytest pytest-asyncio httpx pytest-cov pytest-timeout

      - name: Select Sandbox test target
        id: select-test
        env:
          NILVERA_E2E_RUN_INCOMING_FIXTURE: ${{ inputs.run_incoming_fixture }}
          NILVERA_E2E_RUN_INCOMING_ANSWER: ${{ inputs.run_incoming_answer }}
          NILVERA_E2E_RUN_RECONCILIATION: ${{ inputs.run_reconciliation }}
        run: |
          cd backend
          test_target="$(python scripts/nilvera_sandbox_selector.py)"
          echo "test_target=${test_target}" >> "$GITHUB_OUTPUT"

      - name: Check for Required Secrets
        id: check-key
        env:
          RUN_INCOMING_FIXTURE: ${{ inputs.run_incoming_fixture }}
          RUN_INCOMING_ANSWER: ${{ inputs.run_incoming_answer }}
          RUN_RECONCILIATION: ${{ inputs.run_reconciliation }}
          RECONCILIATION_SOURCE_RUN_ID: ${{ inputs.reconciliation_source_run_id }}
          RECONCILIATION_SOURCE_TIMESTAMP: ${{ inputs.reconciliation_source_timestamp }}
          SENDER_KEY: ${{ secrets.NILVERA_E2E_SENDER_SANDBOX_KEY }}
          RECEIVER_KEY: ${{ secrets.NILVERA_E2E_RECEIVER_SANDBOX_KEY }}
          CORRELATION_HMAC_KEY: ${{ secrets.NILVERA_E2E_CORRELATION_HMAC_KEY }}
          BUYER_VKN: ${{ secrets.NILVERA_E2E_BUYER_VKN }}
          SELLER_VKN: ${{ secrets.NILVERA_E2E_SELLER_VKN }}
        run: |
          if [ "${RUN_INCOMING_FIXTURE}" = "true" ]; then
            if [ -z "${SENDER_KEY}" ] || [ -z "${RECEIVER_KEY}" ] || [ -z "${CORRELATION_HMAC_KEY}" ] || [ -z "${BUYER_VKN}" ] || [ -z "${SELLER_VKN}" ]; then
              echo "::error::BLOCKED_MISSING_FIXTURE_SANDBOX_CONFIGURATION"
              exit 1
            fi
            if [ "${SENDER_KEY}" = "${RECEIVER_KEY}" ]; then
              echo "::error::BLOCKED_IDENTICAL_SANDBOX_KEYS"
              exit 1
            fi
          elif [ "${RUN_RECONCILIATION}" = "true" ]; then
            if [ -z "${SENDER_KEY}" ] || [ -z "${RECEIVER_KEY}" ] || [ -z "${CORRELATION_HMAC_KEY}" ] || [ -z "${BUYER_VKN}" ] || [ -z "${SELLER_VKN}" ] || [ -z "${RECONCILIATION_SOURCE_RUN_ID}" ] || [ -z "${RECONCILIATION_SOURCE_TIMESTAMP}" ]; then
              echo "::error::BLOCKED_MISSING_RECONCILIATION_SANDBOX_CONFIGURATION"
              exit 1
            fi
            if [ "${SENDER_KEY}" = "${RECEIVER_KEY}" ]; then
              echo "::error::BLOCKED_IDENTICAL_SANDBOX_KEYS"
              exit 1
            fi
          elif [ "${RUN_INCOMING_ANSWER}" = "true" ]; then
            if [ -z "${RECEIVER_KEY}" ] || [ -z "${BUYER_VKN}" ] || [ -z "${SELLER_VKN}" ]; then
              echo "::error::BLOCKED_MISSING_ANSWER_SANDBOX_CONFIGURATION"
              exit 1
            fi
          elif [ -z "${SENDER_KEY}" ] || [ -z "${BUYER_VKN}" ] || [ -z "${SELLER_VKN}" ]; then
            echo "::error::BLOCKED_MISSING_SANDBOX_CONFIGURATION"
            exit 1
          fi
          echo "secrets_exist=true" >> "$GITHUB_OUTPUT"

      - name: Run Nilvera Sandbox E2E Tests
        if: steps.check-key.outputs.secrets_exist == 'true'
        env:
          NILVERA_ENABLED: "true"
          NILVERA_E2E_SENDER_SANDBOX_KEY: ${{ secrets.NILVERA_E2E_SENDER_SANDBOX_KEY }}
          NILVERA_E2E_RECEIVER_SANDBOX_KEY: ${{ secrets.NILVERA_E2E_RECEIVER_SANDBOX_KEY }}
          NILVERA_E2E_CORRELATION_HMAC_KEY: ${{ secrets.NILVERA_E2E_CORRELATION_HMAC_KEY }}
          NILVERA_E2E_BUYER_VKN: ${{ secrets.NILVERA_E2E_BUYER_VKN }}
          NILVERA_E2E_SELLER_VKN: ${{ secrets.NILVERA_E2E_SELLER_VKN }}
          NILVERA_E2E_INCOMING_FIXTURE_ALLOWED: ${{ inputs.run_incoming_fixture }}
          NILVERA_E2E_INCOMING_ANSWER_ALLOWED: ${{ inputs.run_incoming_answer }}
          NILVERA_E2E_RECONCILIATION_ALLOWED: ${{ inputs.run_reconciliation }}
          NILVERA_E2E_SOURCE_RUN_ID: ${{ inputs.reconciliation_source_run_id }}
          NILVERA_E2E_SOURCE_RUN_TIMESTAMP: ${{ inputs.reconciliation_source_timestamp }}
          NILVERA_E2E_RUN_ID: ${{ github.run_id }}
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
        run: |
          cd backend
          python -m pytest "${{ steps.select-test.outputs.test_target }}" \
            -m nilvera_sandbox \
            -v --tb=short -q --timeout=300 \
            --junitxml=nilvera-sandbox-results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v5
        if: always() && steps.check-key.outputs.secrets_exist == 'true'
        with:
          name: nilvera-sandbox-results
          path: backend/nilvera-sandbox-results.xml
