name: Syroce PMS CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MONGO_URL: mongodb://localhost:27017/hotel_pms_test
  DB_NAME: hotel_pms_test
  JWT_SECRET: ci-test-secret-key-do-not-use-in-production
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/syroce
  NILVERA_ENABLED: "false"

jobs:
  # ============ LOCKFILE HOST GUARD (HARD GATE) ============
  lockfile-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reject DigitalOcean package-firewall URLs in lockfiles
        run: bash scripts/check-lockfile-hosts.sh

  # ============ BACKEND LINTING (HARD GATE) ============
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (pyproject.toml config)
        run: |
          cd backend
          ruff check .

      - name: Orphan-file regression guard
        run: python backend/scripts/check_orphan_files.py

      - name: Import boundary guard
        run: python backend/scripts/check_import_boundaries.py

      - name: Test skip and inventory budget guard
        run: python scripts/check_skip_budget.py

      - name: KBS extension release package guard
        run: python scripts/build_kbs_extension_package.py --check
        
      # ---- Requirements split guards (Phase 7 of requirements split) ----
      # Both scripts are pure-stdlib (no pip install needed) and run in <1s.
      # See docs/backend_refactors/requirements-split-plan.md and run.md.
      - name: Requirements split parity guard
        # Phase 8.2 (May 2026): legacy aggregate `backend/requirements.txt`
        # was removed; the script's parity-vs-aggregate invariant was
        # retired. The remaining duplicate-check half (Phase 4.5) still
        # runs here: fails if any package name appears as a direct
        # top-level entry in two or more canonical subset files
        # (base/api/worker/ml/reports/integrations/dev). The CI step name
        # is preserved to avoid breaking dashboards; the script filename
        # is preserved to avoid an OAuth-scoped workflow patch.
        # See docs/backend_refactors/requirements-split.run.md Phase 8.2.
        run: python backend/scripts/check_requirements_split_parity.py

      - name: Worker import closure check
        # AST scan of celery_app + celery_tasks recursive import graph,
        # validated against backend/requirements/worker-runtime.txt
        # (Pragmatic case from Phase 4.6 / 5). Fails if any third-party
        # module reachable from worker entry points is NOT covered by
        # the production worker subset. CAVEAT: this is static-only —
        # CI Docker build of worker/Dockerfile remains the authoritative
        # boot smoke (see Phase 5 run.md).
        run: python backend/scripts/check_worker_import_closure.py --target worker-runtime

      - name: API import closure check
        # AST scan of backend/server.py recursive import graph (visits
        # 391 internal files including all routers / bootstrap / domains),
        # validated against backend/requirements/api-runtime.txt
        # (Pragmatic case from Phase 6.0 / 6.1). Fails if any third-party
        # module reachable from server.py is NOT covered by the
        # production backend API subset. CAVEAT: this is static-only —
        # CI Docker build of backend/Dockerfile remains the authoritative
        # boot smoke (see Phase 6.1 run.md).
        run: python backend/scripts/check_api_import_closure.py --target api-runtime

  # ============ FRONTEND LINTING (HARD GATE) ============
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: |
          cd frontend
          yarn install --ignore-engines

      - name: Run ESLint (hard gate)
        run: |
          cd frontend
          npx eslint src/ --quiet

      - name: Stress shard discovery contracts (hard gate)
        run: |
          cd frontend
          node --test \
            e2e-stress/resolve-spec-patterns.test.mjs \
            e2e-stress/production-gates-contract.test.mjs

  # ============ BACKEND TESTS (HARD GATE) ============
  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements/all.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          bash scripts/post_install.sh
          pip install pytest pytest-asyncio httpx pytest-cov pytest-timeout

      - name: Seed test database (hard gate)
        run: |
          cd backend
          python scripts/create_test_user.py || python create_demo_users.py || { echo "::error::No seed script found — tests require a seeded database"; exit 1; }
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}

      - name: Start backend server
        run: |
          cd backend
          uvicorn server:app --host 0.0.0.0 --port 8001 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:8001/api/docs > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 2
          done
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          TESTING: "1"

      - name: Run curated CI test suite (hard gate)
        run: |
          cd backend
          python -m pytest \
            tests/test_hardening_comprehensive.py \
            tests/resilience/ \
            tests/test_controlplane.py \
            tests/test_crypto_engine.py \
            tests/test_outbox_pattern.py \
            tests/test_import_bridge.py \
            tests/test_helpers.py \
            tests/test_core_lockdown.py \
            tests/test_audit_service_wiring.py \
            tests/test_hardening_multi_phase.py \
            tests/test_atomic_booking.py \
            tests/test_safety_rebinding.py \
            tests/test_egress_ci_guard.py \
            tests/test_production_blockers.py \
            tests/test_route_shadowing.py \
            tests/test_hr_shifts_overnight.py \
            tests/test_pms_checkin_night_audit_hardening.py \
            tests/test_quick_id_proxy.py \
            tests/test_diagnostics.py \
            tests/test_secrets_manager.py \
            tests/test_stress_factory_room_move_pool.py \
            tests/unit/test_nilvera_incoming_xml_mapper.py \
            tests/unit/test_nilvera_incoming_answer.py \
            tests/unit/test_nilvera_sandbox_fixture.py \
            tests/unit/test_incoming_invoice_sync_service.py \
            tests/unit/test_incoming_invoice_sync_worker.py \
            tests/unit/test_incoming_invoice_tenant_guard.py \
            tests/test_incoming_invoice_sync_api.py \
            tests/test_invoice_lifecycle_api.py \
            tests/test_invoice_lifecycle_service.py \
            tests/test_invoice_lifecycle_worker.py \
            tests/test_invoice_status_worker.py \
            tests/test_nilvera_log_redaction.py \
            tests/test_bootstrap_invoice_workers.py \
            tests/test_nilvera_worker_lifecycle.py \
            tests/test_gl_ledger.py \
            tests/test_invoice_gl_bridge.py \
            tests/unit/test_kbs_extension_download.py \
            tests/integration/test_academy_cert_race_live.py \
            -v --tb=short -q --timeout=30 --junitxml=test-results.xml
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          # Task #261: live-HTTP integration tests (e.g. test_hr_shifts_overnight)
          # read VITE_BACKEND_URL to target the running backend. CI uvicorn binds
          # to :8001 (see "Start backend server" step above), not the conftest
          # default of :8000.
          VITE_BACKEND_URL: http://localhost:8001

      - name: Run Exely offline regression suite (hard gate)
        run: |
          cd backend
          python -m pytest \
            tests/test_exely_credential_log_security.py \
            tests/test_exely_compatibility_mount.py \
            tests/test_exely_concurrent_current_upsert.py \
            tests/test_exely_reservation_lifecycle.py \
            tests/test_exely_ari_delivery.py \
            tests/test_exely_provider_quota_parser.py \
            tests/test_exely_legacy_closure.py \
            tests/test_exely_legacy_duplicate_fencing.py \
            tests/test_exely_pilot_contract.py \
            tests/test_exely_pilot_import.py \
            tests/test_exely_production_cutover_workflow.py \
            tests/test_safe_startup_log_diagnosis.py \
            tests/unit/test_exely_provider.py \
            tests/integration/test_exely_provider_flows.py \
            -v --tb=short -q --timeout=60 \
            --junitxml=test-results-exely.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("test-results-exely.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
          errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          if tests <= 0 or failures or errors or skipped:
              raise SystemExit(
                  f"Exely hard gate failed: tests={tests} failures={failures} errors={errors} skipped={skipped}"
              )
          print(f"Exely hard gate passed: tests={tests} failures=0 errors=0 skipped=0")
          PY
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          TESTING: "1"

      - name: Run Exely offline failure stress shard (hard gate)
        run: |
          cd backend
          python -m pytest \
            tests/test_exely_compatibility_mount.py \
            tests/test_exely_concurrent_current_upsert.py \
            tests/test_exely_reservation_lifecycle.py \
            tests/test_exely_ari_delivery.py \
            tests/test_exely_pilot_import.py \
            tests/test_exely_provider_quota_parser.py \
            -m exely_failure_stress --strict-markers \
            -v --tb=short -q --timeout=60 \
            --junitxml=test-results-exely-failure-stress.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("test-results-exely-failure-stress.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
          errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          if tests <= 0 or failures or errors or skipped:
              raise SystemExit(
                  "Exely failure stress gate failed: "
                  f"tests={tests} failures={failures} errors={errors} skipped={skipped}"
              )
          print(f"Exely failure stress gate passed: tests={tests} failures=0 errors=0 skipped=0")
          PY
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          TESTING: "1"
          E2E_EXTERNAL_DRY_RUN: "true"

      - name: Run HotelRunner direct regression suite (hard gate)
        run: |
          cd backend
          python -m pytest \
            tests/test_hotelrunner_p0_integrity.py \
            tests/test_hotelrunner_mutation_outcome_safety.py \
            tests/test_hotelrunner_reservation_lock.py \
            tests/test_hotelrunner_compat_security.py \
            tests/test_hotelrunner_webhook_signature.py \
            tests/test_hotelrunner_credential_log_security.py \
            tests/test_hotelrunner_ari_reconciliation.py \
            tests/test_hotelrunner_ari_pilot_contract.py \
            tests/test_hotelrunner_reservation_ack_pilot_contract.py \
            tests/test_hotelrunner_production_safety.py \
            tests/test_hotelrunner_production_cutover_workflow.py \
            tests/test_ws_bridge_health.py \
            tests/test_scheduler_concurrency.py \
            tests/test_channel_event_dedup_claim.py \
            tests/test_catchup_dedup_guard.py \
            tests/test_unmatched_hold.py \
            -v --tb=short -q --timeout=60 \
            --junitxml=test-results-hotelrunner.xml
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          TESTING: "1"

      # Task #323: live_mongo testleri gerçek MongoDB gerektirir; Mongo erişilemezse
      # doctrine gereği atlanır. REQUIRE_LIVE_MONGO=1 ile bu adım, testler GERÇEKTEN
      # koşmadıkça (hepsi skip / hiç koşmama) FAIL olur — skip-as-pass false-green
      # engellenir. Mongo service zaten yukarıda ayağa kalkıyor, bu yüzden CI'da
      # bu testlerin koşması beklenir.
      - name: Run live Mongo feedback tests (no-false-green gate)
        run: |
          cd backend
          python -m pytest \
            tests/test_feedback_reporting_unified_live.py \
            tests/test_incoming_invoice_sync_repository_realdb.py \
            tests/test_invoice_lifecycle_repository_realdb.py \
            tests/test_invoice_lifecycle_migration.py \
            -m live_mongo --strict-markers -v --tb=short -q --timeout=60 \
            --junitxml=test-results-live-mongo.xml
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          REQUIRE_LIVE_MONGO: "1"

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/test-results.xml
            backend/test-results-exely.xml
            backend/test-results-exely-failure-stress.xml
            backend/test-results-live-mongo.xml

  # ============ COMPLETE OFFLINE BACKEND + COVERAGE (HARD GATE) ============
  # The curated backend-test job remains the fast, high-signal gate. This job
  # additionally discovers and executes every non-quarantined backend test that
  # does not require a real provider, provider mutation, or scheduled chaos run.
  backend-full-offline:
    name: Backend Full Offline Suite + Coverage
    runs-on: ubuntu-latest
    needs: backend-lint
    timeout-minutes: 30
    env:
      MONGO_URL: mongodb://localhost:27017/hotel_pms_test?replicaSet=rs0
      DB_NAME: hotel_pms_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-key-do-not-use-in-production
      TESTING: "1"
      NILVERA_ENABLED: "false"
      VITE_BACKEND_URL: http://localhost:8001
      TEST_API_URL: http://localhost:8001
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Start transaction-capable MongoDB replica set
        run: |
          docker run --detach --name syroce-full-mongo --publish 27017:27017 \
            mongo:7.0 --replSet rs0 --bind_ip_all
          ready=0
          for i in $(seq 1 30); do
            if docker exec syroce-full-mongo mongosh --quiet \
              --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::MongoDB did not start within 60 seconds"
            docker logs syroce-full-mongo
            exit 1
          fi
          docker exec syroce-full-mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          primary=0
          for i in $(seq 1 30); do
            if docker exec syroce-full-mongo mongosh --quiet \
              --eval 'quit(rs.status().myState === 1 ? 0 : 1)' >/dev/null 2>&1; then
              primary=1
              break
            fi
            sleep 2
          done
          if [ "$primary" -ne 1 ]; then
            echo "::error::MongoDB replica set did not elect a primary"
            docker logs syroce-full-mongo
            exit 1
          fi

      - name: Install local MongoDB restore-drill binaries
        run: |
          for binary in mongod mongodump mongorestore; do
            docker cp "syroce-full-mongo:/usr/bin/$binary" "/tmp/$binary"
            sudo install -m 0755 "/tmp/$binary" "/usr/local/bin/$binary"
            "$binary" --version
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements/all.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          bash scripts/post_install.sh
          pip install pytest pytest-asyncio httpx pytest-cov pytest-timeout

      - name: Seed isolated test database
        run: |
          cd backend
          python scripts/create_test_user.py || python create_demo_users.py || { echo "::error::No seed script found"; exit 1; }

      - name: Start isolated backend server
        run: |
          cd backend
          uvicorn server:app --host 0.0.0.0 --port 8001 > full-suite-backend.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8001/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Backend did not become ready within 60 seconds"
            cat full-suite-backend.log || true
            exit 1
          fi

      - name: Run complete provider-safe backend suite with coverage
        run: |
          cd backend
          env -u CI -u GITHUB_ACTIONS python -m pytest tests \
            -m 'not live_server and not external and not side_effect and not hotelrunner_pilot and not exely_pilot and not nilvera_sandbox and not chaos_l3 and not chaos_l4' \
            --strict-markers \
            --tb=short -q --timeout=60 \
            --cov --cov-config=pyproject.toml \
            --cov-report=term \
            --cov-report=json:coverage.json \
            --cov-report=html:coverage-html \
            --cov-fail-under=46 \
            --junitxml=full-suite-results.xml
      - name: Enforce business-critical backend coverage floors
        run: |
          python scripts/check_critical_coverage.py \
            backend/coverage.json \
            scripts/critical_backend_coverage.json
      - name: Enforce complete-suite test and skip policy
        run: |
          python scripts/check_junit_policy.py backend/full-suite-results.xml \
            --min-tests 6100 \
            --max-skips 5 \
            --allow-skip 'test_admin_panel_phases' \
            --allow-skip 'test_mice_beo_pdf'

      - name: Upload full-suite results, coverage, and backend log
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-full-offline-results
          path: |
            backend/full-suite-results.xml
            backend/coverage.json
            backend/coverage-html/
            backend/full-suite-backend.log

  # ============ BATTLE E2E TESTS (HARD GATE) ============
  battle-e2e:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements/all.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          bash scripts/post_install.sh
          pip install pytest pytest-asyncio httpx pytest-cov pytest-timeout

      - name: Seed test database (hard gate)
        run: |
          cd backend
          python scripts/create_test_user.py || python create_demo_users.py || { echo "::error::No seed script found — tests require a seeded database"; exit 1; }
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}

      - name: Start backend server
        run: |
          cd backend
          uvicorn server:app --host 0.0.0.0 --port 8001 > battle-backend.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8001/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Backend did not become ready within 60 seconds"
            cat battle-backend.log || true
            exit 1
          fi
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          TESTING: "1"

      - name: Run battle e2e tests
        run: |
          cd backend
          python -m pytest tests/battle \
            -v --tb=short -q --timeout=60 --junitxml=battle-e2e-results.xml
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          VITE_BACKEND_URL: http://localhost:8001

      - name: Upload test results and backend logs
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: battle-e2e-results
          path: |
            backend/battle-e2e-results.xml
            backend/battle-backend.log

  # ============ LOAD TESTS (HARD GATE) ============
  load-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements/all.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          bash scripts/post_install.sh
          pip install pytest pytest-asyncio httpx pytest-timeout

      - name: Seed test database
        run: |
          cd backend
          python scripts/create_test_user.py || python create_demo_users.py || { echo "::error::No seed script found"; exit 1; }
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}

      - name: Start backend server
        run: |
          cd backend
          uvicorn server:app --host 0.0.0.0 --port 8001 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:8001/api/docs > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 2
          done
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          TESTING: "1"

      - name: Run CI load tests (hard gate)
        run: |
          cd backend
          python -m pytest load_tests/ \
            -m ci_load \
            -v --tb=short -q \
            --timeout=60 \
            --junitxml=load-test-results.xml \
            2>&1 | tee load-test-output.log
          # Parse result summary for GitHub Step Summary
          echo "## Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 load-test-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          DB_NAME: ${{ env.DB_NAME }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          LOAD_TEST_API_URL: http://localhost:8001

      - name: Upload load test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: load-test-results
          path: |
            backend/load-test-results.xml
            backend/load-test-output.log

  # ============ FRONTEND BUILD (HARD GATE) ============
  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: |
          cd frontend
          yarn install --ignore-engines

      - name: Build production bundle (hard gate)
        run: |
          cd frontend
          yarn build
        env:
          CI: false
          VITE_BACKEND_URL: http://localhost:8001
          VITE_ENABLE_VISUAL_EDITS: false

      - name: Check bundle size
        run: |
          cd frontend
          du -sh build/
          echo "--- JS Bundle Sizes ---"
          find build/ -name "*.js" -exec du -sh {} \; | sort -rh | head -10

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: frontend/build/

  # ============ SECURITY SCAN (HARD GATE) ============
  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: |
          cd frontend
          yarn install --ignore-engines

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements/all.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          bash scripts/post_install.sh

      - name: Python dependency security audit (CRITICAL — hard gate)
        run: |
          # CVE-2026-6357 fix: pip prior to 26.1 had a self-update timing issue.
          # Upgrade pip itself before running the audit so pip is reported as patched.
          python -m pip install --upgrade 'pip>=26.1'
          pip install pip-audit
          cd backend
          pip-audit --desc \
            2>&1 | tee security-report.txt
          echo "--- Checking for CRITICAL/HIGH vulnerabilities ---"
          pip-audit \
            --ignore-vuln PYSEC-2024-62920 \
            --ignore-vuln PYSEC-2024-113 \
            --ignore-vuln CVE-2024-23342 \
            --ignore-vuln GHSA-rf74-v2fm-23pw \
            --ignore-vuln CVE-2026-33230 \
            --ignore-vuln CVE-2026-33231 \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln PYSEC-2024-271 \
            --ignore-vuln PYSEC-2024-277 \
            --ignore-vuln PYSEC-2026-97 \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln PYSEC-2025-185 \
            || { echo "::error::CRITICAL vulnerabilities found — see security-report.txt"; exit 1; }
          # CVE-2026-3219: pip itself (installer tool, not an app runtime dependency).
          # No fix version published yet; pip's concatenated tar/zip handling is not
          # exercised by our deploy pipeline (we install from pinned requirements only).

      - name: Node.js dependency security audit (high — hard gate)
        run: |
          cd frontend
          AUDIT_EXIT=0
          yarn audit --level high || AUDIT_EXIT=$?
          if [ $((AUDIT_EXIT & 24)) -ne 0 ]; then
            echo "::error::High or critical Node.js vulnerabilities found"
            exit 1
          fi
          echo "No high/critical vulnerabilities (exit code: $AUDIT_EXIT)"

      - name: Check for hardcoded secrets (hard gate)
        run: |
          echo "Scanning for potential secrets..."
          FOUND=0
          # NOTE: || true is REQUIRED here — grep returns exit 1 when no match
          # is found, which is the SUCCESS case. The FOUND flag handles the gate.
          grep -rn "password\s*=\s*['\"][^'\"]\{8,\}" backend/ --include="*.py" \
            --exclude="*test*" --exclude="*demo*" --exclude="*seed*" \
            --exclude="*create_*"\
            --exclude="*conftest*" && FOUND=1 || true
          grep -rn "api_key\s*=\s*['\"]sk-" backend/ --include="*.py" \
            --exclude="*test*" --exclude="*.env" && FOUND=1 || true
          grep -rn "JWT_SECRET\s*=\s*['\"]" backend/ --include="*.py" \
            --exclude="*test*" --exclude="*.env" && FOUND=1 || true
          grep -rn "AKIA[A-Z0-9]\{16\}" backend/ --include="*.py" && FOUND=1 || true
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Hardcoded secrets detected — fix before merge"
            exit 1
          else
            echo "No hardcoded secrets found"
          fi

      - name: Trivy filesystem scan (CRITICAL — hard gate)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: 1

      - name: Trivy HIGH severity (warning only)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH
          exit-code: 0

      - name: Upload security report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: security-report
          path: backend/security-report.txt

  # ============ DOCKER BUILD & PUSH ============
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, load-test, frontend-build, security-scan, battle-e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
            VITE_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build & Push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ============ DEPLOY STAGING ============
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - name: Pre-deploy — Record current revision
        id: pre_deploy
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Staging deployment skipped — KUBECONFIG not configured"
            exit 0
          fi
          echo "${{ secrets.KUBECONFIG }}" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          BACKEND_REV=$(kubectl -n syroce rollout history deployment/syroce-backend --revision=0 2>/dev/null | tail -1 || echo "none")
          FRONTEND_REV=$(kubectl -n syroce rollout history deployment/syroce-frontend --revision=0 2>/dev/null | tail -1 || echo "none")
          echo "backend_rev=$BACKEND_REV" >> "$GITHUB_OUTPUT"
          echo "frontend_rev=$FRONTEND_REV" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging
        if: steps.pre_deploy.outputs.skip != 'true'
        run: |
          echo "${{ secrets.KUBECONFIG }}" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          echo "Deploying SHA ${{ github.sha }} to staging..."
          kubectl -n syroce set image deployment/syroce-backend backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          kubectl -n syroce set image deployment/syroce-frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          kubectl -n syroce set image deployment/syroce-worker worker=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
          echo "Waiting for backend rollout..."
          kubectl -n syroce rollout status deployment/syroce-backend --timeout=300s
          echo "Waiting for frontend rollout..."
          kubectl -n syroce rollout status deployment/syroce-frontend --timeout=300s
          echo "Waiting for worker rollout..."
          kubectl -n syroce rollout status deployment/syroce-worker --timeout=300s

      - name: Post-deploy — Smoke test
        if: steps.pre_deploy.outputs.skip != 'true'
        id: smoke_test
        run: |
          if [ -z "${{ secrets.STAGING_URL }}" ]; then
            echo "::warning::Smoke test skipped — STAGING_URL not configured"
            exit 0
          fi

          echo "## Smoke Test — Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status | Latency | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|:---------|:-------|:--------|:-------|" >> $GITHUB_STEP_SUMMARY

          FAIL=0
          SMOKE_JSON='{"endpoints":['
          FIRST=true

          smoke_check() {
            local NAME="$1" EP="$2"
            local URL="${{ secrets.STAGING_URL }}${EP}"
            local T0=$(date +%s%N)
            local CODE=$(curl -sf "$URL" -o /dev/null -w "%{http_code}" --max-time 15 2>/dev/null) || CODE="000"
            local T1=$(date +%s%N)
            local MS=$(( (T1 - T0) / 1000000 ))
            local RES=$( [ "$CODE" = "200" ] && echo "OK" || echo "FAIL" )
            echo "| \`${EP}\` | ${CODE} | ${MS}ms | ${RES} |" >> $GITHUB_STEP_SUMMARY
            if [ "$FIRST" = "true" ]; then FIRST=false; else SMOKE_JSON="${SMOKE_JSON},"; fi
            SMOKE_JSON="${SMOKE_JSON}{\"name\":\"${NAME}\",\"path\":\"${EP}\",\"status\":${CODE},\"latency_ms\":${MS},\"result\":\"${RES}\"}"
            [ "$CODE" = "200" ] && return 0 || return 1
          }

          smoke_check "Health API" "/api/health/" || FAIL=1
          smoke_check "Frontend" "/" || FAIL=1
          smoke_check "API Docs" "/api/docs" || echo "::warning::Docs endpoint not reachable (non-critical)"
          smoke_check "Channel Health" "/api/ops/dashboard/channel-health" || FAIL=1

          SMOKE_JSON="${SMOKE_JSON}]}"
          echo "$SMOKE_JSON" > /tmp/smoke_results.json

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL" -eq 0 ]; then
            echo "> All critical smoke tests passed" >> $GITHUB_STEP_SUMMARY
            echo "smoke_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "> **CRITICAL: Smoke test failed**" >> $GITHUB_STEP_SUMMARY
            echo "smoke_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && steps.pre_deploy.outputs.skip != 'true'
        run: |
          echo "::error::Staging deploy failed — initiating rollback"
          echo "${{ secrets.KUBECONFIG }}" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl -n syroce rollout undo deployment/syroce-backend
          kubectl -n syroce rollout undo deployment/syroce-frontend
          kubectl -n syroce rollout undo deployment/syroce-worker
          echo "Waiting for rollback to stabilize..."
          kubectl -n syroce rollout status deployment/syroce-backend --timeout=180s
          kubectl -n syroce rollout status deployment/syroce-frontend --timeout=180s
          echo "Rollback complete"

          echo "## Rollback Executed — Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:-------|:------|" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | Deploy failure |" >> $GITHUB_STEP_SUMMARY
          echo "| Action | \`kubectl rollout undo\` (backend + frontend + worker) |" >> $GITHUB_STEP_SUMMARY

      - name: Record deploy event in Control Plane
        if: always() && steps.pre_deploy.outputs.skip != 'true'
        run: |
          if [ -z "${{ secrets.BACKEND_API_URL }}" ]; then
            echo "::notice title=Deploy Event::Deploy event recording skipped — BACKEND_API_URL not configured"
            echo "Deploy event (local): sha=${{ github.sha }} env=staging status=${{ job.status }} actor=${{ github.actor }}"
            exit 0
          fi
          SMOKE=$(cat /tmp/smoke_results.json 2>/dev/null || echo '{}')
          IS_ROLLBACK=$( [ "${{ job.status }}" != "success" ] && echo "true" || echo "false" )
          curl -sf -X POST "${{ secrets.BACKEND_API_URL }}/api/ops/deploys" \
            -H "Content-Type: application/json" \
            -d "{
              \"sha\": \"${{ github.sha }}\",
              \"environment\": \"staging\",
              \"status\": \"${{ job.status }}\",
              \"actor\": \"${{ github.actor }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"smoke_test\": $SMOKE,
              \"rollback\": $IS_ROLLBACK
            }" || echo "::warning::Failed to record deploy event in Control Plane"
            # NOTE: || echo is intentional — observability recording failure must not block a successful deploy

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f /tmp/kubeconfig

      - name: Notify — Staging deploy result
        if: always() && steps.pre_deploy.outputs.skip != 'true'
        run: |
          STATUS="${{ job.status }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          ACTOR="${{ github.actor }}"
          BRANCH="${{ github.ref_name }}"

          # Always write structured summary to GitHub Actions
          echo "## Deploy Result — Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:------|:------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | **${STATUS}** |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${SHORT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${BRANCH}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | ${ACTOR} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | staging |" >> $GITHUB_STEP_SUMMARY

          # GitHub annotations for visibility
          if [ "$STATUS" = "success" ]; then
            echo "::notice title=Staging Deploy Basarili::${SHORT_SHA} → staging by ${ACTOR}"
          else
            echo "::error title=Staging Deploy Basarisiz::${SHORT_SHA} → staging by ${ACTOR} — rollback initiated"
          fi

          # Slack webhook (if configured)
          if [ -z "${{ secrets.SLACK_DEPLOY_WEBHOOK }}" ]; then
            echo "::notice title=Slack Bildirimi::Slack bildirimi atlanıyor — SLACK_DEPLOY_WEBHOOK yapılandırılmamış. GitHub Actions Summary'de sonuçlar mevcut."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            COLOR="#36a64f"
            TITLE="Staging Deploy Basarili"
          else
            COLOR="#ff0000"
            TITLE="Staging Deploy Basarisiz — Rollback Yapildi"
          fi
          curl -sf -X POST "${{ secrets.SLACK_DEPLOY_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"attachments\":[{\"color\":\"$COLOR\",\"title\":\"$TITLE\",\"fields\":[{\"title\":\"SHA\",\"value\":\"$SHORT_SHA\",\"short\":true},{\"title\":\"Actor\",\"value\":\"$ACTOR\",\"short\":true},{\"title\":\"Branch\",\"value\":\"$BRANCH\",\"short\":true},{\"title\":\"Environment\",\"value\":\"staging\",\"short\":true}]}]}" || true
          # NOTE: || true is intentional — Slack notification failure must not block a successful deploy
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build]
    # Production currently runs on DigitalOcean App Platform. Keep this
    # Kubernetes path dormant unless the repository explicitly selects it.
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_TARGET == 'kubernetes'
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Pre-deploy — DB backup
        id: backup
        run: |
          if [ -z "${{ secrets.MONGO_BACKUP_URI }}" ]; then
            echo "::warning::DB backup skipped — MONGO_BACKUP_URI not configured"
            exit 0
          fi
          echo "Creating pre-deploy backup..."
          mongodump --uri="${{ secrets.MONGO_BACKUP_URI }}" --archive=/tmp/pre-deploy-${{ github.sha }}.gz --gzip
          echo "Backup created: pre-deploy-${{ github.sha }}.gz"

      - name: Pre-deploy — Record current revision
        id: pre_deploy
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "::error::KUBECONFIG not configured for the selected Kubernetes production target"
            exit 1
          fi
          echo "${{ secrets.KUBECONFIG }}" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          BACKEND_REV=$(kubectl -n syroce get deployment syroce-backend -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "0")
          echo "backend_gen=$BACKEND_REV" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        if: steps.pre_deploy.outputs.skip != 'true'
        run: |
          echo "${{ secrets.KUBECONFIG }}" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          echo "Deploying SHA ${{ github.sha }} to production..."
          kubectl -n syroce set image deployment/syroce-backend backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          kubectl -n syroce set image deployment/syroce-frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          kubectl -n syroce set image deployment/syroce-worker worker=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
          echo "Waiting for backend rollout..."
          kubectl -n syroce rollout status deployment/syroce-backend --timeout=600s
          echo "Waiting for frontend rollout..."
          kubectl -n syroce rollout status deployment/syroce-frontend --timeout=300s
          echo "Waiting for worker rollout..."
          kubectl -n syroce rollout status deployment/syroce-worker --timeout=300s

      - name: Post-deploy — Smoke test
        if: steps.pre_deploy.outputs.skip != 'true'
        id: smoke_test
        run: |
          if [ -z "${{ secrets.PRODUCTION_URL }}" ]; then
            echo "::error::PRODUCTION_URL not configured; production smoke test is mandatory"
            exit 1
          fi

          echo "## Smoke Test — Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status | Latency | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|:---------|:-------|:--------|:-------|" >> $GITHUB_STEP_SUMMARY

          FAIL=0
          SMOKE_JSON='{"endpoints":['
          FIRST=true

          smoke_check() {
            local NAME="$1" EP="$2"
            local URL="${{ secrets.PRODUCTION_URL }}${EP}"
            local T0=$(date +%s%N)
            local CODE=$(curl -sf "$URL" -o /dev/null -w "%{http_code}" --max-time 15 2>/dev/null) || CODE="000"
            local T1=$(date +%s%N)
            local MS=$(( (T1 - T0) / 1000000 ))
            local RES=$( [ "$CODE" = "200" ] && echo "OK" || echo "FAIL" )
            echo "| \`${EP}\` | ${CODE} | ${MS}ms | ${RES} |" >> $GITHUB_STEP_SUMMARY
            if [ "$FIRST" = "true" ]; then FIRST=false; else SMOKE_JSON="${SMOKE_JSON},"; fi
            SMOKE_JSON="${SMOKE_JSON}{\"name\":\"${NAME}\",\"path\":\"${EP}\",\"status\":${CODE},\"latency_ms\":${MS},\"result\":\"${RES}\"}"
            [ "$CODE" = "200" ] && return 0 || return 1
          }

          smoke_check "Health API" "/api/health/" || FAIL=1
          smoke_check "Frontend" "/" || FAIL=1
          smoke_check "Channel Health" "/api/ops/dashboard/channel-health" || FAIL=1

          SMOKE_JSON="${SMOKE_JSON}]}"
          echo "$SMOKE_JSON" > /tmp/smoke_results.json

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL" -eq 0 ]; then
            echo "> All production smoke tests passed" >> $GITHUB_STEP_SUMMARY
            echo "smoke_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "> **CRITICAL: Production smoke test failed**" >> $GITHUB_STEP_SUMMARY
            echo "smoke_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && steps.pre_deploy.outputs.skip != 'true'
        run: |
          echo "::error::Production deploy failed — initiating rollback"
          echo "${{ secrets.KUBECONFIG }}" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl -n syroce rollout undo deployment/syroce-backend
          kubectl -n syroce rollout undo deployment/syroce-frontend
          kubectl -n syroce rollout undo deployment/syroce-worker
          echo "Waiting for rollback to stabilize..."
          kubectl -n syroce rollout status deployment/syroce-backend --timeout=300s
          kubectl -n syroce rollout status deployment/syroce-frontend --timeout=300s
          echo "Rollback complete"

          echo "## Rollback Executed — Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:-------|:------|" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | Deploy failure |" >> $GITHUB_STEP_SUMMARY
          echo "| Action | \`kubectl rollout undo\` (backend + frontend + worker) |" >> $GITHUB_STEP_SUMMARY

      - name: Record deploy event in Control Plane
        if: always() && steps.pre_deploy.outputs.skip != 'true'
        run: |
          if [ -z "${{ secrets.BACKEND_API_URL }}" ]; then
            echo "::notice title=Deploy Event::Deploy event recording skipped — BACKEND_API_URL not configured"
            echo "Deploy event (local): sha=${{ github.sha }} env=production status=${{ job.status }} actor=${{ github.actor }}"
            exit 0
          fi
          SMOKE=$(cat /tmp/smoke_results.json 2>/dev/null || echo '{}')
          IS_ROLLBACK=$( [ "${{ job.status }}" != "success" ] && echo "true" || echo "false" )
          curl -sf -X POST "${{ secrets.BACKEND_API_URL }}/api/ops/deploys" \
            -H "Content-Type: application/json" \
            -d "{
              \"sha\": \"${{ github.sha }}\",
              \"environment\": \"production\",
              \"status\": \"${{ job.status }}\",
              \"actor\": \"${{ github.actor }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"smoke_test\": $SMOKE,
              \"rollback\": $IS_ROLLBACK
            }" || echo "::warning::Failed to record deploy event in Control Plane"
            # NOTE: || echo is intentional — observability recording failure must not block a successful deploy

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f /tmp/kubeconfig

      - name: Notify — Production deploy result
        if: always() && steps.pre_deploy.outputs.skip != 'true'
        run: |
          STATUS="${{ job.status }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          ACTOR="${{ github.actor }}"
          BRANCH="${{ github.ref_name }}"

          # Always write structured summary to GitHub Actions
          echo "## Deploy Result — Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:------|:------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | **${STATUS}** |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${SHORT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${BRANCH}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | ${ACTOR} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **production** |" >> $GITHUB_STEP_SUMMARY

          # GitHub annotations
          if [ "$STATUS" = "success" ]; then
            echo "::notice title=PROD Deploy Basarili::${SHORT_SHA} → production by ${ACTOR}"
          else
            echo "::error title=PROD Deploy BASARISIZ::${SHORT_SHA} → production by ${ACTOR} — rollback initiated"
          fi

          # Slack webhook (if configured)
          if [ -z "${{ secrets.SLACK_DEPLOY_WEBHOOK }}" ]; then
            echo "::notice title=Slack Bildirimi::Slack bildirimi atlanıyor — SLACK_DEPLOY_WEBHOOK yapılandırılmamış. GitHub Actions Summary'de sonuçlar mevcut."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            COLOR="#36a64f"
            TITLE="PROD Deploy Basarili"
          else
            COLOR="#ff0000"
            TITLE="PROD Deploy BASARISIZ — Rollback Yapildi"
          fi
          curl -sf -X POST "${{ secrets.SLACK_DEPLOY_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"attachments\":[{\"color\":\"$COLOR\",\"title\":\"$TITLE\",\"fields\":[{\"title\":\"SHA\",\"value\":\"$SHORT_SHA\",\"short\":true},{\"title\":\"Actor\",\"value\":\"$ACTOR\",\"short\":true},{\"title\":\"Branch\",\"value\":\"$BRANCH\",\"short\":true},{\"title\":\"Environment\",\"value\":\"production\",\"short\":true}]}]}" || true
          # NOTE: || true is intentional — Slack notification failure must not block a successful deploy
