name: Mobile Quality Gates

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-quality.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Config, types, contracts and dependency compatibility
        run: npm run check
        env:
          CI: '1'
      - name: Moderate, high and critical dependency gate
        run: npm audit --omit=dev --audit-level=moderate
