name: Deploy App Platform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: app-platform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/syroce
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Build & Push Images ────────────────────────────────────────
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
            VITE_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build & Push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ── Deploy to App Platform ─────────────────────────────────────
  deploy-app-platform:
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Validate deployment target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.environment }}" = "production" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Production deploy yalnız main branch üzerinden yapılabilir."
            exit 1
          fi

      - name: Validate required configuration
        shell: bash
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          set -euo pipefail
          test -n "$DO_TOKEN" || {
            echo "::error::DIGITALOCEAN_ACCESS_TOKEN tanımlı değil."
            exit 1
          }
          test -n "$DO_APP_ID" || {
            echo "::error::DO_APP_ID tanımlı değil."
            exit 1
          }

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: 1.164.0
          no_auth: true

      - name: Authenticate doctl with retry
        shell: bash
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3 4 5; do
            echo "DigitalOcean token validation attempt ${ATTEMPT}/5..."
            if timeout 120 doctl auth init -t "$DO_TOKEN"; then
              exit 0
            fi

            if [ "$ATTEMPT" -eq 5 ]; then
              echo "::error::DigitalOcean token validation failed after 5 attempts."
              exit 1
            fi

            sleep "$((ATTEMPT * 15))"
          done

      - name: Trigger App Platform Deployment
        id: app-platform-deploy
        env:
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GHCR_REPO: ghcr.io/${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          echo "Fetching current App Spec..."
          doctl apps spec get "$DO_APP_ID" --format json > /tmp/spec.json
          
          echo "Verifying pre-mutation App Spec..."
          for COMP in "backend" "frontend" "worker" "beat"; do
             if [ "$COMP" == "backend" ]; then EXPECTED_REPO="syroce-backend"; LIST=".services[]?"; fi
             if [ "$COMP" == "frontend" ]; then EXPECTED_REPO="syroce-frontend"; LIST=".services[]?"; fi
             if [ "$COMP" == "worker" ]; then EXPECTED_REPO="syroce-worker"; LIST=".workers[]?"; fi
             if [ "$COMP" == "beat" ]; then EXPECTED_REPO="syroce-worker"; LIST=".workers[]?"; fi
             
             COUNT=$(jq -r "[$LIST | select(.name==\"$COMP\")] | length" /tmp/spec.json)
             if [ "$COUNT" -ne 1 ]; then
                echo "::error::Component $COMP must exist exactly once, found $COUNT"
                exit 1
             fi
             
             ACTUAL_REPO=$(jq -r "$LIST | select(.name==\"$COMP\") | .image.repository // empty" /tmp/spec.json)
             if [ -z "$ACTUAL_REPO" ]; then
                echo "::error::Component $COMP is missing image repository"
                exit 1
             fi
             
             ACTUAL_REPO_NAME="${ACTUAL_REPO##*/}"
             if [ "$ACTUAL_REPO_NAME" != "$EXPECTED_REPO" ]; then
                echo "::error::Component $COMP repository mismatch. Expected: $EXPECTED_REPO, Actual: $ACTUAL_REPO_NAME"
                exit 1
             fi
          done
          
          if jq -e '(.services[]? | select(.image? != null)) or (.workers[]? | select(.image? != null))' /tmp/spec.json > /dev/null; then
            echo "App contains image-based components. Updating spec with new SHA tag ($GITHUB_SHA)..."
            jq --arg sha "${GITHUB_SHA}" '
              if .services then
                .services |= map(
                  if (.image? != null) and (.name == "backend" or .name == "frontend")
                  then .image.tag = $sha | del(.image.digest)
                  else .
                  end
                )
              else .
              end
              |
              if .workers then
                .workers |= map(
                  if (.image? != null) and (.name == "worker" or .name == "beat")
                  then .image.tag = $sha | del(.image.digest)
                  else .
                  end
                )
              else .
              end
            ' /tmp/spec.json > /tmp/new_spec.json
            
            echo "Verifying tags in /tmp/new_spec.json..."
            for COMP in "backend" "frontend" "worker" "beat"; do
               if [ "$COMP" == "backend" ] || [ "$COMP" == "frontend" ]; then LIST=".services[]?"; else LIST=".workers[]?"; fi
               if [ "$COMP" == "backend" ]; then EXPECTED_REPO="syroce-backend"; fi
               if [ "$COMP" == "frontend" ]; then EXPECTED_REPO="syroce-frontend"; fi
               if [ "$COMP" == "worker" ]; then EXPECTED_REPO="syroce-worker"; fi
               if [ "$COMP" == "beat" ]; then EXPECTED_REPO="syroce-worker"; fi
               
               COUNT=$(jq -r "[$LIST | select(.name==\"$COMP\")] | length" /tmp/new_spec.json)
               if [ "$COUNT" -ne 1 ]; then
                  echo "::error::Component $COMP missing or duplicated in new spec"
                  exit 1
               fi
               
               ACTUAL_REPO=$(jq -r "$LIST | select(.name==\"$COMP\") | .image.repository // empty" /tmp/new_spec.json)
               ACTUAL_REPO_NAME="${ACTUAL_REPO##*/}"
               if [ "$ACTUAL_REPO_NAME" != "$EXPECTED_REPO" ]; then
                  echo "::error::Component $COMP repository changed in new spec! Expected: $EXPECTED_REPO"
                  exit 1
               fi
               
               TAG=$(jq -r "$LIST | select(.name==\"$COMP\") | .image.tag // empty" /tmp/new_spec.json)
               if [ "$TAG" != "$GITHUB_SHA" ]; then
                 echo "::error::Component $COMP tag ($TAG) does not match expected SHA ($GITHUB_SHA)"
                 exit 1
               fi
            done
            echo "Verification passed."
            
            echo "Triggering deployment by updating the App Spec..."
            doctl apps update "$DO_APP_ID" --spec /tmp/new_spec.json --wait
          else
            echo "App is not image-based (likely GitHub source). Triggering standard deployment..."
            doctl apps create-deployment "$DO_APP_ID" --wait
          fi
          
          echo "Fetching Active Deployment ID..."
          DEPLOYMENT_ID="$(doctl apps get "$DO_APP_ID" --format ActiveDeployment.ID --no-header)"
          
          test -n "$DEPLOYMENT_ID" || {
            echo "::error::Deployment ID alınamadı."
            exit 1
          }
          
          STATUS="$(doctl apps get-deployment "$DO_APP_ID" "$DEPLOYMENT_ID" --format Phase --no-header)"
          
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "::error::Deployment ACTIVE olmadı. Phase: $STATUS"
            exit 1
          fi
          
          echo "Fetching live App Spec for verification..."
          doctl apps spec get "$DO_APP_ID" --format json > /tmp/live_spec.json
          echo "Verifying live tags and repositories..."
          for COMP in "backend" "frontend" "worker" "beat"; do
             if [ "$COMP" == "backend" ] || [ "$COMP" == "frontend" ]; then LIST=".services[]?"; else LIST=".workers[]?"; fi
             if [ "$COMP" == "backend" ]; then EXPECTED_REPO="syroce-backend"; fi
             if [ "$COMP" == "frontend" ]; then EXPECTED_REPO="syroce-frontend"; fi
             if [ "$COMP" == "worker" ]; then EXPECTED_REPO="syroce-worker"; fi
             if [ "$COMP" == "beat" ]; then EXPECTED_REPO="syroce-worker"; fi
             
             COUNT=$(jq -r "[$LIST | select(.name==\"$COMP\")] | length" /tmp/live_spec.json)
             if [ "$COUNT" -ne 1 ]; then
                echo "::error::Live component $COMP missing or duplicated"
                exit 1
             fi
             
             ACTUAL_REPO=$(jq -r "$LIST | select(.name==\"$COMP\") | .image.repository // empty" /tmp/live_spec.json)
             ACTUAL_REPO_NAME="${ACTUAL_REPO##*/}"
             if [ "$ACTUAL_REPO_NAME" != "$EXPECTED_REPO" ]; then
                echo "::error::Live component $COMP repository mismatch! Expected: $EXPECTED_REPO, Actual: $ACTUAL_REPO_NAME"
                exit 1
             fi
             
             TAG=$(jq -r "$LIST | select(.name==\"$COMP\") | .image.tag // empty" /tmp/live_spec.json)
             if [ "$TAG" != "$GITHUB_SHA" ]; then
               echo "::error::Live component $COMP tag ($TAG) does not match expected SHA ($GITHUB_SHA)"
               exit 1
             fi
          done
          echo "Live tag and repository verification passed."
          
          echo "Deployment completed successfully. (ID: $DEPLOYMENT_ID, Phase: $STATUS)"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID:** $DEPLOYMENT_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** $STATUS" >> $GITHUB_STEP_SUMMARY

      - name: Smoke test
        shell: bash
        env:
          APP_BASE_URL: ${{ secrets.STRESS_E2E_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$APP_BASE_URL" || {
            echo "::error::APP_BASE_URL tanımlı değil."
            exit 1
          }
          BASE_URL="${APP_BASE_URL%/}"
          echo "Running smoke test on $BASE_URL..."
          curl --fail --silent --show-error \
            --max-time 20 \
            "${BASE_URL}/health/live" >/dev/null
          echo "Smoke test passed."

      - name: Report safe HotelRunner local total reconciliation signal
        if: inputs.environment == 'production'
        shell: bash
        env:
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
          DEPLOYMENT_ID: ${{ steps.app-platform-deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          umask 077
          logs_file="$(mktemp)"
          trap 'rm -f "$logs_file"' EXIT

          marker=""
          for attempt in 1 2 3 4; do
            if doctl apps logs "$DO_APP_ID" backend \
              --deployment "$DEPLOYMENT_ID" \
              --type run \
              --tail -1 >"$logs_file" 2>/dev/null; then
              marker="$(
                grep -E \
                  'HotelRunner local gross-total reconciliation completed event_count=[0-9]+ candidate_count=[0-9]+ repaired_count=[0-9]+' \
                  "$logs_file" | tail -n 1 || true
              )"
            fi
            if [ -n "$marker" ]; then
              break
            fi
            sleep 15
          done

          if [ -z "$marker" ]; then
            echo "::warning::HotelRunner local total reconciliation signal was not visible in the safe log window."
            exit 0
          fi

          safe_marker="${marker#*HotelRunner local gross-total reconciliation completed }"
          echo "HotelRunner local gross-total reconciliation completed ${safe_marker}"
          {
            echo "### HotelRunner Local Total Reconciliation"
            echo "- ${safe_marker}"
          } >> "$GITHUB_STEP_SUMMARY"
