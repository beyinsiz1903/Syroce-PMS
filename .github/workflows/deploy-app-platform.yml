name: Deploy App Platform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: app-platform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/syroce
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Build & Push Images ────────────────────────────────────────
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
            VITE_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build & Push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ── Deploy to App Platform ─────────────────────────────────────
  deploy-app-platform:
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Validate deployment target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.environment }}" = "production" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Production deploy yalnız main branch üzerinden yapılabilir."
            exit 1
          fi

      - name: Validate required configuration
        shell: bash
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          set -euo pipefail
          test -n "$DO_TOKEN" || {
            echo "::error::DIGITALOCEAN_ACCESS_TOKEN tanımlı değil."
            exit 1
          }
          test -n "$DO_APP_ID" || {
            echo "::error::DO_APP_ID tanımlı değil."
            exit 1
          }

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger App Platform Deployment
        env:
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GHCR_REPO: ghcr.io/${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          echo "Fetching current App Spec..."
          doctl apps spec get "$DO_APP_ID" --format json > /tmp/spec.json
          
          # Verify image repositories if components are image-based
          for COMP in "syroce-backend" "backend" "syroce-frontend" "frontend"; do
            ACTUAL_REPO="$(
              jq -r '
                .services[]?
                | select(.name=="'$COMP'")
                | .image.repository // empty
              ' /tmp/spec.json
            )"
            if [ -n "$ACTUAL_REPO" ]; then
              EXPECTED_REPO="syroce-${COMP#syroce-}"
              ACTUAL_REPO_NAME="${ACTUAL_REPO##*/}"
              if [[ "$ACTUAL_REPO_NAME" != "$EXPECTED_REPO" ]]; then
                 echo "::error::Image repository mismatch for $COMP. Expected to contain: $EXPECTED_REPO, Actual: $ACTUAL_REPO"
                 exit 1
              fi
            fi
          done
          
          # Verify image repository for worker component
          ACTUAL_WORKER_REPO="$(
            jq -r '
              .workers[]?
              | select(.name=="syroce-worker" or .name=="worker")
              | .image.repository // empty
            ' /tmp/spec.json
          )"
          if [ -n "$ACTUAL_WORKER_REPO" ]; then
            EXPECTED_WORKER_REPO="syroce-worker"
            ACTUAL_WORKER_REPO_NAME="${ACTUAL_WORKER_REPO##*/}"
            if [[ "$ACTUAL_WORKER_REPO_NAME" != "$EXPECTED_WORKER_REPO" ]]; then
               echo "::error::Worker image repository mismatch. Expected to contain: $EXPECTED_WORKER_REPO, Actual: $ACTUAL_WORKER_REPO"
               exit 1
            fi
          fi
          
          # Check if the app has any image-based components
          if jq -e '(.services[]? | select(.image? != null)) or (.workers[]? | select(.image? != null))' /tmp/spec.json > /dev/null; then
            echo "App contains image-based components. Updating spec with new SHA tag ($GITHUB_SHA)..."
            jq --arg sha "${GITHUB_SHA}" '
              if .services then
                .services |= map(
                  if (.image? != null) and
                     (
                       .name == "syroce-backend" or
                       .name == "backend" or
                       .name == "syroce-frontend" or
                       .name == "frontend"
                     )
                  then .image.tag = $sha | del(.image.digest)
                  else .
                  end
                )
              else .
              end
              |
              if .workers then
                .workers |= map(
                  if (.image? != null) and
                     (.name == "syroce-worker" or .name == "worker")
                  then .image.tag = $sha | del(.image.digest)
                  else .
                  end
                )
              else .
              end
            ' /tmp/spec.json > /tmp/new_spec.json
            
            echo "Triggering deployment by updating the App Spec..."
            doctl apps update "$DO_APP_ID" --spec /tmp/new_spec.json --wait
          else
            echo "App is not image-based (likely GitHub source). Triggering standard deployment..."
            doctl apps create-deployment "$DO_APP_ID" --wait
          fi
          
          echo "Fetching Active Deployment ID..."
          DEPLOYMENT_ID="$(doctl apps get "$DO_APP_ID" --format ActiveDeployment.ID --no-header)"
          
          test -n "$DEPLOYMENT_ID" || {
            echo "::error::Deployment ID alınamadı."
            exit 1
          }
          
          STATUS="$(doctl apps get-deployment "$DO_APP_ID" "$DEPLOYMENT_ID" --format Phase --no-header)"
          
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "::error::Deployment ACTIVE olmadı. Phase: $STATUS"
            exit 1
          fi
          
          echo "Deployment completed successfully. (ID: $DEPLOYMENT_ID, Phase: $STATUS)"
          
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID:** $DEPLOYMENT_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** $STATUS" >> $GITHUB_STEP_SUMMARY

      - name: Smoke test
        shell: bash
        env:
          APP_BASE_URL: ${{ secrets.STRESS_E2E_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$APP_BASE_URL" || {
            echo "::error::APP_BASE_URL tanımlı değil."
            exit 1
          }
          BASE_URL="${APP_BASE_URL%/}"
          echo "Running smoke test on $BASE_URL..."
          curl --fail --silent --show-error \
            --max-time 20 \
            "${BASE_URL}/health/live" >/dev/null
          echo "Smoke test passed."
