name: Deploy App Platform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: app-platform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/syroce
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Build & Push Images ────────────────────────────────────────
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
            VITE_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build & Push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ── Deploy to App Platform ─────────────────────────────────────
  deploy-app-platform:
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Validate deployment target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.environment }}" = "production" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Production deploy yalnız main branch üzerinden yapılabilir."
            exit 1
          fi

      - name: Validate required configuration
        shell: bash
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          set -euo pipefail
          test -n "$DO_TOKEN" || {
            echo "::error::DIGITALOCEAN_ACCESS_TOKEN tanımlı değil."
            exit 1
          }
          test -n "$DO_APP_ID" || {
            echo "::error::DO_APP_ID tanımlı değil."
            exit 1
          }

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger App Platform Deployment
        env:
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          set -euo pipefail
          echo "Fetching current App Spec..."
          doctl apps get "$DO_APP_ID" --format json > /tmp/app.json
          
          # Check if the backend component uses an image registry
          if jq -e '.[0].spec.services[]? | select(.name=="syroce-backend" or .name=="backend") | has("image")' /tmp/app.json > /dev/null; then
            echo "App is image-based. Updating spec with new SHA tag (${{ github.sha }})..."
            jq '.[0].spec | 
              (if .services then .services |= map(if .name=="syroce-backend" or .name=="backend" or .name=="syroce-frontend" or .name=="frontend" then .image.tag="${{ github.sha }}" else . end) else . end) | 
              (if .workers then .workers |= map(if .name=="syroce-worker" or .name=="worker" then .image.tag="${{ github.sha }}" else . end) else . end)' /tmp/app.json > /tmp/new_spec.json
            
            echo "Triggering deployment by updating the App Spec..."
            doctl apps update "$DO_APP_ID" --spec /tmp/new_spec.json
            
            # Apps update automatically triggers a deployment. We need to get the active deployment ID.
            # However, doctl apps update doesn't return the deployment ID in a simple format, so we use create-deployment if we just want a reliable ID.
            # Actually, doctl apps update returns the updated app which includes the in-progress deployment ID.
            DEPLOYMENT_ID="$(doctl apps get "$DO_APP_ID" --format InProgressDeployment.ID --no-header)"
            
            # If no deployment is in progress immediately after update, we might need to trigger one, but usually it starts instantly.
            if [ -z "$DEPLOYMENT_ID" ]; then
              DEPLOYMENT_ID="$(doctl apps create-deployment "$DO_APP_ID" --format ID --no-header)"
            fi
          else
            echo "App is not image-based (likely GitHub source). Triggering standard deployment..."
            DEPLOYMENT_ID="$(doctl apps create-deployment "$DO_APP_ID" --format ID --no-header)"
          fi
          
          test -n "$DEPLOYMENT_ID" || {
            echo "::error::Deployment ID alınamadı."
            exit 1
          }
          
          echo "Waiting for deployment $DEPLOYMENT_ID to complete..."
          # Since doctl apps create-deployment --wait is not used above to unify logic, we wait explicitly
          doctl apps get-deployment "$DO_APP_ID" "$DEPLOYMENT_ID" --wait
          
          STATUS="$(doctl apps get-deployment "$DO_APP_ID" "$DEPLOYMENT_ID" --format Phase --no-header)"
          
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "::error::Deployment ACTIVE olmadı. Phase: $STATUS"
            exit 1
          fi
          
          echo "Deployment completed successfully. (ID: $DEPLOYMENT_ID, Phase: $STATUS)"
          
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID:** $DEPLOYMENT_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** $STATUS" >> $GITHUB_STEP_SUMMARY

      - name: Smoke test
        shell: bash
        env:
          APP_BASE_URL: ${{ secrets.STRESS_E2E_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$APP_BASE_URL" || {
            echo "::error::APP_BASE_URL tanımlı değil."
            exit 1
          }
          BASE_URL="${APP_BASE_URL%/}"
          echo "Running smoke test on $BASE_URL..."
          curl --fail --silent --show-error \
            --max-time 20 \
            "${BASE_URL}/health/live" >/dev/null
          echo "Smoke test passed."
