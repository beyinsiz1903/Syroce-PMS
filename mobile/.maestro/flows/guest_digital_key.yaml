appId: com.syroce.pms
name: "Guest: Dijital anahtar görüntüleme (smoke)"
tags:
  - smoke
  - guest
# Dedicated guest credentials must be supplied by the caller / CI secrets.
# Staff credentials must never be substituted for this role acceptance.
---
- runFlow:
    file: ../helpers/login.yaml
    env:
      LOGIN_EMAIL: ${SMOKE_GUEST_EMAIL}
      LOGIN_PASSWORD: ${SMOKE_GUEST_PASSWORD}

# The dedicated synthetic guest fixture must have a checked-in stay. Enter
# through its visible service action rather than a custom-scheme shortcut.
# Missing fixture or denied access fails; staff credentials are never used.
- scrollUntilVisible:
    element:
      text: "Dijital Anahtar"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    text: "Dijital Anahtar"

- extendedWaitUntil:
    visible:
      id: "smoke-digital-key"
    timeout: 30000
- assertVisible:
    text: "Dijital Anahtar"
