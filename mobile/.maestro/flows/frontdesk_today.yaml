appId: com.syroce.pms
name: "Frontdesk: Bugün açılışı (smoke)"
tags:
  - smoke
  - frontdesk
---
- runFlow:
    file: ../helpers/login.yaml
    env:
      LOGIN_EMAIL: ${SMOKE_EMAIL}
      LOGIN_PASSWORD: ${SMOKE_PASSWORD}

# Navigate through the actual role UI, preserving app permission checks.
- runFlow: ../helpers/frontdesk.yaml

# After login the front_desk role lands on the "Bugün" tab. We assert
# the canonical labels rendered by mobile/app/(frontdesk)/index.tsx so
# regressions in the home screen surface fail this smoke check.
- extendedWaitUntil:
    visible:
      text: "Bugün Giriş"
    timeout: 30000
- assertVisible:
    text: "Bugün Çıkış"
- assertVisible:
    text: "Hızlı check-in"
- assertVisible:
    text: "Hızlı check-out"
