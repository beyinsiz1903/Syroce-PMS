appId: com.syroce.pms
name: "Frontdesk: Bugün açılışı (smoke)"
tags:
  - smoke
  - frontdesk
env:
  SMOKE_EMAIL: info@syroce.com
  SMOKE_PASSWORD: Syroce2026
---
- runFlow:
    file: ../helpers/login.yaml
    env:
      LOGIN_EMAIL: ${SMOKE_EMAIL}
      LOGIN_PASSWORD: ${SMOKE_PASSWORD}

# Admin and manager accounts may land on their own dashboard.
# Open the authorized frontdesk route explicitly; route permissions still apply.
- openLink: "syrocepms:///(frontdesk)"
# iOS may request confirmation before opening this app link.
- runFlow:
    when:
      visible: "Open in.*Syroce PMS.*"
    commands:
      - tapOn: "Open"

# After login the front_desk role lands on the "Bugün" tab. We assert
# the canonical labels rendered by mobile/app/(frontdesk)/index.tsx so
# regressions in the home screen surface fail this smoke check.
- extendedWaitUntil:
    visible:
      text: "Bugün Giriş"
    timeout: 30000
- assertVisible:
    text: "Bugün Çıkış"
- assertVisible:
    text: "Hızlı check-in"
- assertVisible:
    text: "Hızlı check-out"
