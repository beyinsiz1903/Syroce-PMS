appId: com.syroce.pms
name: "Push: bildirim kaydı (smoke)"
tags:
  - smoke
  - push
env:
  SMOKE_EMAIL: info@syroce.com
  SMOKE_PASSWORD: Syroce2026
---
- runFlow:
    file: login.yaml
    env:
      SMOKE_EMAIL: ${SMOKE_EMAIL}
      SMOKE_PASSWORD: ${SMOKE_PASSWORD}

# The current app enables push only on explicit opt-in. Open the shared
# profile instead of assuming a role-specific landing screen or old labels.
- openLink: "syrocepms:///(home)/profile"
# iOS may request confirmation before opening this app link.
- runFlow:
    when:
      visible: "Open in.*Syroce PMS.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "smoke-push-status"
    timeout: 30000
- tapOn:
    text: "Bildirimleri etkinleştir"
    optional: true
- extendedWaitUntil:
    notVisible:
      text: "Bildirimler henüz etkinleştirilmedi."
    timeout: 20000

# Preserve the existing four terminal outcomes; unknown must not pass.
- extendedWaitUntil:
    visible:
      id: "smoke-push-status"
      text: "Bildirimler bu hesap için etkin.|Bildirim izni kapalı.*|Bu ortamda cihaz bildirimi desteklenmiyor.|Bildirim kaydı tamamlanamadı.*"
    timeout: 10000
