appId: com.syroce.pms
name: "Push: bildirim kaydı (smoke)"
tags:
  - smoke
  - push
---
- runFlow:
    file: ../helpers/login.yaml
    env:
      LOGIN_EMAIL: ${SMOKE_EMAIL}
      LOGIN_PASSWORD: ${SMOKE_PASSWORD}

# Exercise the declared denial path. Shared login allows all permissions;
# leaving that override active auto-accepts the iOS prompt and waits for APNs
# on a Simulator instead of testing denial.
- setPermissions:
    permissions:
      notifications: deny

# The current app enables push only on explicit opt-in. Open the frontdesk More screen instead of assuming a role-specific landing screen or old labels.
- runFlow:
    file: ../helpers/open_link.yaml
    env:
      TARGET_LINK: "syrocepms:///(frontdesk)/more"
# The notification card is below the role and module sections.
- scrollUntilVisible:
    element:
      id: "smoke-push-status"
    direction: DOWN
    centerElement: true
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "smoke-push-status"
    timeout: 30000
# Non-registered states render an opt-in button below the status row.
# Bring the button fully above the tab bar before tapping it.
- runFlow:
    when:
      notVisible: "Bildirimler bu hesap için etkin."
    commands:
      - scrollUntilVisible:
          element:
            text: "Bildirimleri etkinleştir"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - waitForAnimationToEnd
      - takeScreenshot: artifacts/push-before-optin
      - tapOn:
          text: "Bildirimleri etkinleştir"
          retryTapIfNoChange: false
      - waitForAnimationToEnd
      - takeScreenshot: artifacts/push-after-optin
# CI exercises the explicit denial path without registering a delivery device.
# This is not evidence that real APNs delivery succeeded.
- runFlow:
    when:
      visible: ".*Would Like to Send You Notifications.*"
    commands:
      - tapOn: "Don.t Allow"
- extendedWaitUntil:
    notVisible:
      text: "Bildirimler henüz etkinleştirilmedi."
    timeout: 20000

# Preserve the existing four terminal outcomes; unknown must not pass.
- extendedWaitUntil:
    visible:
      id: "smoke-push-status"
      text: "Bildirimler bu hesap için etkin.|Bildirim izni kapalı.*|Bu ortamda cihaz bildirimi desteklenmiyor.|Bildirim kaydı tamamlanamadı.*"
    timeout: 10000
