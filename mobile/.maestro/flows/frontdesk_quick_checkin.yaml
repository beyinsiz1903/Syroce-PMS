appId: com.syroce.pms
name: "Frontdesk: Hızlı check-in başlangıcı (smoke)"
tags:
  - smoke
  - frontdesk
---
- runFlow:
    file: ../helpers/login.yaml
    env:
      LOGIN_EMAIL: ${SMOKE_EMAIL}
      LOGIN_PASSWORD: ${SMOKE_PASSWORD}

# Navigate through the actual role UI, preserving app permission checks.
- runFlow: ../helpers/frontdesk.yaml

# Wait for the Today screen to settle, then start the quick check-in
# flow from the primary CTA on the home tab.
- extendedWaitUntil:
    visible:
      id: "smoke-today-quick-checkin"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "smoke-today-quick-checkin"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "smoke-today-quick-checkin"

# Header rendered by mobile/app/(frontdesk)/checkin.tsx (tr.checkin.title).
- extendedWaitUntil:
    visible:
      text: "Hızlı Check-in"
    timeout: 20000

# Scan CTA must be present so QR / kimlik tarama akışı tetiklenebilir.
- assertVisible:
    text: "QR / Kimlik Tara"
