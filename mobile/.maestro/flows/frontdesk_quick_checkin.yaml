appId: com.syroce.pms
name: "Frontdesk: Hızlı check-in başlangıcı (smoke)"
tags:
  - smoke
  - frontdesk
env:
  SMOKE_EMAIL: info@syroce.com
  SMOKE_PASSWORD: Syroce2026
---
- runFlow:
    file: ../helpers/login.yaml
    env:
      LOGIN_EMAIL: ${SMOKE_EMAIL}
      LOGIN_PASSWORD: ${SMOKE_PASSWORD}

# Admin and manager accounts may land on their own dashboard.
# Open the authorized frontdesk route explicitly; route permissions still apply.
- openLink: "syrocepms:///(frontdesk)"
# iOS may request confirmation before opening this app link.
- runFlow:
    when:
      visible: "Open in.*Syroce PMS.*"
    commands:
      - tapOn: "Open"

# Wait for the Today screen to settle, then start the quick check-in
# flow from the primary CTA on the home tab.
- extendedWaitUntil:
    visible:
      id: "smoke-today-quick-checkin"
    timeout: 30000
- tapOn:
    id: "smoke-today-quick-checkin"

# Header rendered by mobile/app/(frontdesk)/checkin.tsx (tr.checkin.title).
- extendedWaitUntil:
    visible:
      text: "Hızlı Check-in"
    timeout: 20000

# Scan CTA must be present so QR / kimlik tarama akışı tetiklenebilir.
- assertVisible:
    text: "QR / Kimlik Tara"
