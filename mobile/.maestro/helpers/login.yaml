appId: com.syroce.pms
name: "Shared login commands (credentials supplied by caller)"
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow

# Login screen renders.
- extendedWaitUntil:
    visible:
      text: "Giriş Yap"
    timeout: 30000

- tapOn:
    id: "smoke-login-email"
- inputText: ${LOGIN_EMAIL}

- tapOn:
    id: "smoke-login-password"
- inputText: ${LOGIN_PASSWORD}
- hideKeyboard

- tapOn:
    id: "smoke-login-submit"

# Server-side auth must succeed.
- extendedWaitUntil:
    notVisible:
      text: "E-posta veya şifre hatalı"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      text: "Sunucuya ulaşılamıyor, tekrar dene"
    timeout: 15000

# Login screen header must disappear (we're past the auth gate).
- extendedWaitUntil:
    notVisible:
      id: "smoke-login-submit"
    timeout: 30000

# Decline the Simulator's optional password-save sheet. It can otherwise
# cover the destination and remain above later clearState launches.
- tapOn:
    text: "Not Now"
    optional: true

# iOS 26's Passwords sheet is missing from the XCTest hierarchy (native
# screenshots in run46003794381). The text tap above cannot dismiss it there.
# On the pinned iPhone17 simulator, decline at the observed Not Now button;
# never press Save or change Passwords/AutoFill security settings. If the sheet
# is absent this point lies on read-only dashboard/navigation content. Every
# caller still asserts its own destination after this shared login helper.
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: artifacts/login-before-password-sheet-dismissal
      - tapOn:
          point: "31%,63%"
          retryTapIfNoChange: false
      - waitForAnimationToEnd
      - takeScreenshot: artifacts/login-after-password-sheet-dismissal
