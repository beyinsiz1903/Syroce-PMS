# A successful but malformed auth response must not silently allow all sites.
map $agency_widget_csp $agency_widget_frame_policy {
    default $agency_widget_csp;
    "" "frame-ancestors 'none';";
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Immutable hashed assets (js/css/images from Vite build)
    location ~* ^/(js|assets)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Favicon & manifest
    location ~* \.(ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # This file decides which hashed application assets a browser may use.
    # Keep it out of every intermediary cache, even if an upstream gateway
    # applies an immutable rule to generic JavaScript files.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # Socket.IO is mounted by FastAPI under /ws/socket.io/. Keep the legacy
    # /socket.io/ path as a rewrite target for older workspace pages, but
    # route both paths to the same backend mount. Without the /ws location
    # the SPA fallback returns index.html to the websocket handshake and each
    # page waits through the client's retry timeout.
    location /ws/socket.io/ {
        proxy_pass http://backend:8001/ws/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Legacy Socket.IO proxy
    location /socket.io/ {
        proxy_pass http://backend:8001/ws/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Only the public widget can be embedded cross-origin. Resolve its current
    # agency allowlist before serving HTML; never reuse another agency's policy.
    location = /agency-widget {
        set $agency_widget_key $arg_key;
        auth_request /_agency-widget-frame-policy;
        auth_request_set $agency_widget_csp $upstream_http_x_widget_frame_policy;
        add_header Content-Security-Policy $agency_widget_frame_policy always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # No internal SPA redirect: that would discard the per-widget headers.
        try_files /index.html =404;
    }

    location = /_agency-widget-frame-policy {
        internal;
        # A backend replacement must not leave widget authorization pointing
        # at the old container IP until the frontend is restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $agency_widget_backend backend:8001;
        proxy_pass http://$agency_widget_backend/api/marketplace/v1/widget/frame-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Widget-Token $agency_widget_key;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # SPA routing — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Block dot-files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }
}
